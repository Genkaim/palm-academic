name: Build native iOS migration

on:
  workflow_dispatch:
  push:
    branches:
      - ios-native-rewrite
    tags:
      - 'v0.3.6'

permissions:
  contents: write

jobs:
  build-ios-native:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease
          mkdir -p build
          cp app/build/outputs/apk/release/app-release.apk build/PalmAcademic-v0.3.6.apk

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build unsigned iPhoneOS app
        id: xcodebuild
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project iosApp/PalmAcademicIOS.xcodeproj \
            -scheme PalmAcademic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios-native \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/ios-native-xcodebuild.log

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PalmAcademic-v0.3.6-ios-native-diagnostics
          path: build/ios-native-xcodebuild.log
          if-no-files-found: ignore

      - name: Expose Xcode errors in annotations
        if: steps.xcodebuild.outcome == 'failure'
        shell: bash
        run: |
          echo "Xcode build failed; last diagnostics:"
          if [ -f build/ios-native-xcodebuild.log ]; then
            grep -E 'error:|warning:|BUILD FAILED|CompileSwift|SwiftEmitModule' build/ios-native-xcodebuild.log | tail -n 40 || true
          fi
          echo "::error title=Native iOS Xcode build failed::See the xcodebuild diagnostics above or rerun on the ios-native-rewrite branch."

      - name: Stop after failed Xcode build
        if: steps.xcodebuild.outcome == 'failure'
        run: exit 1

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios-native/Build/Products/Release-iphoneos/PalmAcademic.app"
          test -d "$APP_PATH"
          mkdir -p build/ios-native-ipa/Payload
          cp -R "$APP_PATH" build/ios-native-ipa/Payload/PalmAcademic.app
          printf '%s\n' 'Native iOS migration preview: not tested on a physical iPhone or iPad.' > build/ios-native-ipa/NO-PHYSICAL-DEVICE-TEST.txt
          ditto -c -k --sequesterRsrc --keepParent build/ios-native-ipa/Payload build/PalmAcademic-v0.3.6-ios-native-unsigned.ipa

      - name: Upload unsigned IPA and test note
        uses: actions/upload-artifact@v4
        with:
          name: PalmAcademic-v0.3.6-ios-native-unsigned
          path: |
            build/PalmAcademic-v0.3.6.apk
            build/PalmAcademic-v0.3.6-ios-native-unsigned.ipa
            build/ios-native-ipa/NO-PHYSICAL-DEVICE-TEST.txt
            build/ios-native-xcodebuild.log

      - name: Prepare release notes
        if: github.ref == 'refs/heads/ios-native-rewrite' || github.ref == 'refs/tags/v0.3.6'
        shell: bash
        run: |
          cat > build/PalmAcademic-v0.3.6-release-notes.md <<'EOF'
          ## PalmAcademic v0.3.6 原生 iOS 迁移预览

          - 使用原生 SwiftUI + URLSession，替换原 WKWebView 壳。
          - 包含原生登录、学校选择、门户分组和结构化页面展示。
          - Android APK 版本为 0.3.6（versionCode 18），与 iOS MARKETING_VERSION 0.3.6 一致。
          - IPA 未签名，需要 Apple 开发者证书签名或侧载重签名。
          - **此版本没有经过实体 iPhone 或 iPad 实机测试，不建议作为正式生产版本使用。**
          - iOS 的后台监测、通知历史、更新检测和课表导出仍待后续原生移植。
          EOF

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/ios-native-rewrite' || github.ref == 'refs/tags/v0.3.6'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v0.3.6"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              --clobber \
              build/PalmAcademic-v0.3.6.apk \
              build/PalmAcademic-v0.3.6-ios-native-unsigned.ipa \
              build/ios-native-ipa/NO-PHYSICAL-DEVICE-TEST.txt
            gh release edit "$release_tag" \
              --title "PalmAcademic v0.3.6 双端预发布" \
              --notes-file build/PalmAcademic-v0.3.6-release-notes.md
          else
            gh release create "$release_tag" \
              --verify-tag \
              --prerelease \
              --title "PalmAcademic v0.3.6 双端预发布" \
              --notes-file build/PalmAcademic-v0.3.6-release-notes.md \
              build/PalmAcademic-v0.3.6.apk \
              build/PalmAcademic-v0.3.6-ios-native-unsigned.ipa \
              build/ios-native-ipa/NO-PHYSICAL-DEVICE-TEST.txt
          fi
