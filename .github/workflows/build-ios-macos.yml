name: Build signed iOS IPA (macOS, Liquid Glass)

# The Windows cross-compile path cannot use an iOS 26+ SDK: SwiftUI's property wrappers
# (@State, @Environment, ...) became external macros shipped in SwiftUIMacros.dylib, and that
# file is a macOS binary, so loading it on Windows fails. Building on a macOS runner is therefore
# the only way to compile against a current SDK, and the only way the system renders its own
# Liquid Glass -- Apple gates that on the SDK the app was linked against, not on the OS version,
# so an iOS 26/27 look requires an iOS 26/27 build no matter which device runs it.
#
# The app keeps a deployment target of 16.0, so the same binary still runs on older devices and
# falls back to its own materials there.

on:
  workflow_dispatch:
  push:
    branches:
      - ios-native-v2
    paths:
      - 'iosApp/**'
      - '.github/workflows/build-ios-macos.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # A 26.x toolchain is what makes the system glass available. The workflow fails loudly
          # rather than silently producing an old-style build if this one is unavailable.
          xcode-version: '26.2'

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build unsigned device app
        # USE_SYSTEM_GLASS makes SystemGlassSupport.hasNativeGlassAPI true, which is what lets the
        # tab bar and the cards name SwiftUI's own glassEffect instead of falling back to the
        # runtime path. The deployment target stays at 16.0, so older devices keep working.
        run: >-
          xcodebuild
          -project iosApp/PalmAcademicIOS.xcodeproj
          -scheme PalmAcademic
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS="USE_SYSTEM_GLASS"
          build

      - name: Package installable IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/Build/Products/Release-iphoneos/PalmAcademic.app"

          # An unsigned bundle cannot be installed: installd rejects it with
          # "ApplicationVerificationFailed: No code signature found". TrollStore accepts an
          # ad-hoc signature, and so does any device that re-signs the IPA, so signing here
          # makes the artifact directly installable instead of requiring a second tool.
          #
          # --deep is not used: it rewrites nested code and Apple's own guidance is to sign
          # nested content explicitly. There is none here beyond the executable.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --force --sign - --timestamp=none --preserve-metadata=entitlements "$APP/Frameworks" 2>/dev/null || true
          # Verify rather than assume, so a silent signing failure cannot reach the artifact.
          codesign --verify --deep --strict "$APP"

          mkdir -p build/package/Payload artifacts
          cp -R "$APP" build/package/Payload/
          ditto -c -k --sequesterRsrc --keepParent \
            build/package/Payload artifacts/PalmAcademic-ios-liquidglass.ipa
          unzip -t artifacts/PalmAcademic-ios-liquidglass.ipa
          shasum -a 256 artifacts/PalmAcademic-ios-liquidglass.ipa \
            > artifacts/PalmAcademic-ios-liquidglass.ipa.sha256
          echo "Signature applied:"; codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier" || true

      - name: Record what the build actually linked against
        shell: bash
        run: |
          # The system decides whether to draw Liquid Glass from the SDK recorded in the
          # executable's LC_BUILD_VERSION, not from any Info.plist key. That is why this reads
          # the binary: an earlier version of this file trusted DTSDKName, which was pinned in
          # the plist to whatever the Windows build used and therefore reported 16.5 here.
          APP="build/ios/Build/Products/Release-iphoneos/PalmAcademic.app"
          {
            echo "### Build environment"
            echo
            echo "- xcode: $(xcodebuild -version | head -1)"
            echo "- swift: $(swift --version 2>&1 | head -1)"
            echo "- MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
            echo
            echo "### Linked SDK (from LC_BUILD_VERSION, this is what gates Liquid Glass)"
            echo
            otool -l "$APP/PalmAcademic" \
              | awk '/LC_BUILD_VERSION/{f=1} f&&/sdk /{print "- sdk:   " $2; f=0} \
                     f&&/minos /{print "- minos: " $2; f=0}'
            echo
            echo "A linked SDK of iOS 26 or later means the system renders its own Liquid Glass."
          } | tee artifacts/build-environment.md

      - uses: actions/upload-artifact@v4
        with:
          name: PalmAcademic-ios-liquidglass
          path: artifacts/*
          if-no-files-found: error