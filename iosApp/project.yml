name: PalmAcademicIOS

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"

targets:
  PalmAcademic:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    resources:
      - Resources/schools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.edu.cupk.portalreader.ios
        PRODUCT_NAME: PalmAcademic
        MARKETING_VERSION: 0.3.6
        CURRENT_PROJECT_VERSION: 18
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 掌上教务
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
