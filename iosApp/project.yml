name: PalmAcademicIOS

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "26.0"

targets:
  PalmAcademic:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # The school catalog and the reader adapters are read at runtime by path
      # (SchoolCatalog.readBundledText resolves "schools/<id>.json" and "adapters/<id>-reader.js"
      # through Bundle.main.url(forResource:withExtension:subdirectory:)). Without these two the
      # catalog is empty and the school picker renders blank, so they must keep their directory
      # layout in the bundle: `type: folder` makes them folder references rather than loose files.
      - path: Resources/schools
        type: folder
        buildPhase: resources
      - path: Resources/adapters
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.edu.cupk.portalreader.ios
        PRODUCT_NAME: PalmAcademic
        MARKETING_VERSION: 0.4.9
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Info.plist is checked in rather than generated. Xcode's generated plist rewrites
        # CFBundleIcons, which would drop the icon entry the Windows cross-compile path relies on.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: NO
